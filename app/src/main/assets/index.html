<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كراسة تحضير الرواد</title><style>body{font-family:system-ui;background:#f3f5f8;color:#172c48;margin:0}header{background:linear-gradient(120deg,#112d55,#087a85);color:white;padding:24px;text-align:center}main{max-width:760px;margin:auto;padding:18px}section{background:white;padding:18px;border-radius:14px;margin:12px 0;box-shadow:0 2px 9px #0001}label{display:block;margin:12px 0 5px;font-weight:bold}input,textarea,select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #bcc8d4;border-radius:8px;font:inherit}textarea{min-height:85px}button{background:#0d6383;color:white;border:0;border-radius:9px;padding:12px;margin:5px;cursor:pointer}button.secondary{background:#b38b39}small{color:#657383}#status{padding:8px;color:#176343}@media print{header,button,#status{display:none}body{background:white}section{box-shadow:none}}</style></head><body><header><h1>👑 كراسة تحضير الرواد الذكية</h1><p>مركز رواد المستقبل • إصدار تجريبي 0.2</p></header><main><section><label>اسم المعلم</label><input id="teacher"><label>المادة</label><input id="subject" placeholder="الرياضيات"><label>الصف</label><input id="grade" placeholder="الثالث الثانوي"><label>عنوان الدرس</label><input id="lesson"><label>اليوم والتاريخ</label><input id="date" type="date"><label>الحصة</label><input id="period"><label>الفصل</label><input id="classroom"><label>عدد الحصص</label><input id="count" type="number"><label>الحضور</label><input id="present" type="number"><label>الغياب</label><input id="absent" type="number"></section><section><h2>عناصر التحضير السبعة</h2><label>1. البيانات الأساسية</label><small>تُعبأ في الأعلى</small><label>2. أهداف التعلم (الأهداف السلوكية)</label><textarea id="goals"></textarea><label>3. المقدمة أو التمهيد (الخبرات السابقة)</label><textarea id="intro"></textarea><label>4. الوسائل التعليمية</label><textarea id="tools"></textarea><label>5. العرض (إجراءات التدريس)</label><textarea id="presentation"></textarea><label>6. التقويم</label><textarea id="assessment"></textarea><label>7. الواجب المنزلي</label><textarea id="homework"></textarea></section><section><button onclick="save()">حفظ التحضير</button><button onclick="window.print()" class="secondary">طباعة / PDF</button><button onclick="draft()">إنشاء هيكل إرشادي</button><button onclick="clearForm()">تحضير جديد</button><p id="status"></p><p><small>تنبيه: الهيكل الإرشادي ليس تحضيرًا مولدًا بالذكاء الاصطناعي من كتاب المنهج. لا توجد خدمة ذكاء اصطناعي متصلة في هذا الإصدار.</small></p></section><section><h2>التحضيرات المحفوظة</h2><div id="saved"></div></section></main><script>const ids=['teacher','subject','grade','lesson','date','period','classroom','count','present','absent','goals','intro','tools','presentation','assessment','homework'];function data(){let o={};ids.forEach(k=>o[k]=document.getElementById(k).value);return o}function fill(o){ids.forEach(k=>document.getElementById(k).value=o[k]||'')}function store(){try{return JSON.parse(localStorage.getItem('ruwad-preps')||'[]')}catch(e){return []}}function save(){let o=data();if(!o.lesson){alert('اكتب عنوان الدرس أولًا');return}let a=store();a.unshift({...o,id:Date.now()});localStorage.setItem('ruwad-preps',JSON.stringify(a));document.getElementById('status').textContent='تم الحفظ على هذا الجهاز';render()}function render(){let el=document.getElementById('saved');el.innerHTML='';store().forEach(o=>{let b=document.createElement('button');b.textContent=(o.subject||'مادة')+' — '+o.lesson;b.onclick=()=>{fill(o);window.scrollTo(0,0)};el.appendChild(b)})}function draft(){let l=document.getElementById('lesson').value.trim();if(!l){alert('اكتب عنوان الدرس');return}let vals={goals:'يحدد المعلم أهدافًا قابلة للقياس خاصة بدرس '+l,intro:'مراجعة الخبرات السابقة المرتبطة بالدرس.',tools:'السبورة، الكتاب المدرسي، الوسائل المناسبة.',presentation:'تهيئة، شرح المفاهيم، مثال موجه، تدريب فردي، مناقشة.',assessment:'أسئلة شفوية وتطبيقية للتحقق من تحقق الأهداف.',homework:'تدريبات مناسبة من الكتاب المدرسي يحددها المعلم.'};Object.keys(vals).forEach(k=>{if(!document.getElementById(k).value)document.getElementById(k).value=vals[k]});document.getElementById('status').textContent='أُنشئ هيكل إرشادي للمراجعة وليس تحضيرًا بالذكاء الاصطناعي'}function clearForm(){fill({});document.getElementById('status').textContent=''}render();</script></body></html>
